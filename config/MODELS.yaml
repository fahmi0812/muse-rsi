# RunBudget — step budget per task (Fase 4). Enforced by
# scripts/run_budget.py, not by the model: start a budget before the
# task, check it before each step, spend after each step.
# Per-role step caps already live above as max_steps; this section is
# the task-level default and the overrun policy.
run_budget:
  default_max_steps: 20
  # Task-level overrides (a task may set its own budget at start time).
  # Defaults: small tasks 10, eval/audit runs 20, full RSI runs 40.
  task_budgets:
    small_fix: 10
    eval_run: 20
    rsi_run: 40
  overrun_policy:
    # Never silently continue past 2x budget.
    at_budget: "stop new steps, snapshot current state"
    at_2x_budget: "abort the task, roll back to the last green snapshot"
    always:
      - "log the decision in decision.tsv with outcome=failed"
      - "escalate to the user with the snapshot name and the reason"
