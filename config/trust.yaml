# trust.yaml — Trust Ladder A0–A5, v3.1 "otonomi maksimal" (Fahmi, 22 Nov 2026).
#
# Default is autonomy: the agent acts, merges, and reports. Fahmi reviews
# after the fact (daily digest, sampling, the `veto` label, STOP) instead
# of approving before. Only a small hard core still needs him.
# This file is in the hard core (config/protected_paths.txt): the loop can
# never edit it, so it can never grant itself more than this.
#
# A0 Baca dan ukur — otomatis.
# A1 Workspace reversibel (scenes, log, draf, worktree ~/workspace) —
#   otomatis dengan snapshot.
# A2 Perubahan repo (skill, router, registri, docs, tools, template) —
#   push ke branch rsi/<run_id>; auto-merge begitu CI hijau.
#   Demosi: revert setelah merge / veto / koreksi Fahmi / canary
#   tersandung -> 7 hari mode veto_window (tetap tanpa izin, hanya ditunda).
# A3 File root yang dibaca tiap percakapan (AGENTS.md, TOOLS.md,
#   HEARTBEAT.md, MEMORY.md) — otomatis dengan snapshot + T2; dicatat di
#   digest. Demosi: koreksi Fahmi -> 7 hari veto_window.
# A4 Verifier dan engine (config/veto_paths.txt) — kasus eval baru dan
#   canary baru: auto-merge setelah veto window 2 jam. Perbaikan engine
#   dan verifier kini AUTO (merge begitu CI hijau).
#   Perubahan yang MELONGGARKAN (hapus/ubah kasus eval, hapus canary,
#   ubah sampel known-bad, hapus file verifier) masuk hard core.
# A5 Hard core — hanya Fahmi:
#   * Safety Envelope inti (config/protected_paths.txt): trust, limits,
#     critique, protected/veto paths, autonomy_gate, verifier_selftest,
#     .github/, SOUL §1–4 / IDENTITY / USER.
#   * Aksi eksternal, tak bisa dibalik, atau berbiaya: uang/API berbayar,
#     pesan ke orang lain, deploy produksi, publish di luar repo sendiri,
#     vault dan kunci API, hapus permanen.
#
# Kelas ditentukan dari diff oleh scripts/autonomy_gate.py
# (AUTO -> A2/A3, VETO -> A4, HARD -> A5), bukan dari klaim agen.

version: 2
updated: "2026-11-22"

classes:
  A0:
    name: "Baca dan ukur"
    mode: automatic
    requires: []
  A1:
    name: "Workspace reversibel"
    mode: automatic
    requires: ["snapshot_ok"]
    demote_on: ["snapshot_restore_failed"]
    demoted_mode: veto_window
  A2:
    name: "Perubahan repo"
    mode: auto_merge
    requires: ["ci_green"]
    demote_on: ["revert_after_merge", "veto", "fahmi_correction", "canary_tripped"]
    demoted_mode: veto_window
    demote_for_days: 7
  A3:
    name: "File root yang dibaca tiap percakapan"
    mode: automatic
    requires: ["snapshot_ok", "t2_reviewed"]
    demote_on: ["fahmi_correction", "veto"]
    demoted_mode: veto_window
    demote_for_days: 7
  A4:
    name: "Verifier dan engine (menambah/mengetatkan)"
    mode: veto_window
    requires: ["ci_green", "verifier_selftest_green"]
    demote_on: ["revert_after_merge", "veto", "canary_tripped"]
    demoted_mode: fahmi_merge
    demote_for_days: 7
  A5:
    name: "Hard core: Safety Envelope inti dan aksi eksternal/berbayar/permanen"
    mode: fahmi_only
    requires: ["fahmi_decision"]

# Current level per class (v3.1: autonomy by default, nothing to earn).
current:
  A0: automatic
  A1: automatic
  A2: auto_merge
  A3: automatic
  A4: veto_window
  A5: fahmi_only
