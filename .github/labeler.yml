# Auto-label pull requests by changed files.
# Format: mapping (actions/labeler@v5) — a list here silently labels nothing.
skill:
  - changed-files:
      - any-glob-to-any-file: 'skills/index.md'
router:
  - changed-files:
      - any-glob-to-any-file: 'skills/router/**'
      - any-glob-to-any-file: 'scripts/route.py'
      - any-glob-to-any-file: 'scripts/eval_routing*'
setup:
  - changed-files:
      - any-glob-to-any-file: 'setup/**'
docs:
  - changed-files:
      - any-glob-to-any-file: 'docs/**'
      - any-glob-to-any-file: '*.md'
ci:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'
