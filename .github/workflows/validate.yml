# validate.yml v3.0 — SIAP TEMPEL (Fahmi terapkan lewat web UI GitHub)
# JANGAN push file ini lewat API/konektor: GitHub App tidak punya izin
# workflows (403). Di web UI: repo fahmi0812/muse-rsi -> .github/workflows/
# validate.yml -> paste seluruh isi ini -> Commit.
# Perubahan vs v2: path filter +eval/ +config/ +docs/**; gitleaks pakai
# checksum SHA-256; job envelope-guard; job held-out (slot decrypt).
# v3.1 (otonomi maksimal): workflow_dispatch (auto-merge.yml memanggilnya),
# unit test gate + verifier_selftest, envelope-guard sungguhan memakai
# scripts/autonomy_gate.py yang SHA-256-nya di-pin di bawah.
name: Validate registry

on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'config/**'
      - 'eval/**'
      - 'docs/**'
      - 'tests/**'
      - 'setup/**'
      - 'install.sh'
      - 'tools/**'
      - '.github/**'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - 'config/**'
      - 'eval/**'
      - 'docs/**'
      - 'tests/**'
      - 'setup/**'
      - 'install.sh'
      - 'tools/**'
      - '.github/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Registry matches the generator
        run: python3 scripts/generate_registry.py --check
      - name: Routing eval (full suite, top-3)
        run: python3 scripts/eval_routing.py --registry skills/router/registry.json
      - name: Routing eval --strict top-1 (metric, informational)
        run: python3 scripts/eval_routing.py --registry skills/router/registry.json --strict || echo "strict is a metric, not a hard gate (baseline 106/114)"
      - name: Router self-test
        run: python3 scripts/route.py --self-test
      - name: Canary regression tests
        run: python3 scripts/test_canary.py
      - name: Validate registry structure
        run: python3 scripts/validate_registry.py
      - name: Eval manifest --verify
        run: python3 scripts/eval_manifest.py --verify
      - name: Facts + drift check
        run: |
          python3 scripts/gen_facts.py --check
          python3 scripts/drift_check.py
      - name: Unit tests + cycle read-only audit
        run: |
          python3 tests/test_scorecard.py
          python3 tests/test_gen_facts.py
          python3 tests/test_autonomy_gate.py
          python3 tests/test_trust.py
          python3 scripts/rsi_cycle.py check-readonly
      - name: Verifier self-test (every guard must reject known-bad input)
        run: python3 scripts/verifier_selftest.py
      - name: SKILL.md frontmatter is present and parses
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = []
          for p in sorted(pathlib.Path('skills').glob('*/SKILL.md')):
              text = p.read_text(encoding='utf-8')
              if not text.startswith('---\n'):
                  bad.append(f'{p}: missing YAML frontmatter')
                  continue
              end = text.find('\n---\n', 4)
              if end < 0:
                  bad.append(f'{p}: unterminated frontmatter')
                  continue
              try:
                  fm = yaml.safe_load(text[4:end])
              except Exception as e:
                  bad.append(f'{p}: frontmatter does not parse: {e}')
                  continue
              if not isinstance(fm, dict) or not fm.get('name') or not fm.get('description'):
                  bad.append(f'{p}: frontmatter needs name + description')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          print('SKILL.md frontmatter OK')
          PY
      - name: Shell scripts parse
        run: |
          for f in install.sh scripts/*.sh tools/scan-secrets.sh; do bash -n "$f"; done
          echo "bash -n OK"
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Node files parse
        run: node --check tools/visual-check/check.mjs && echo "node --check OK"
      - name: Secret scan (gitleaks, redacted, checksum-verified)
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir --no-banner --redact .
          echo "SECRET SCAN CLEAN"
      # SHA-256 di atas adalah SHA resmi gitleaks v8.30.1 linux_x64
      # dari gitleaks_8.30.1_checksums.txt (halaman rilis GitHub,
      # dicek 22 Nov 2026). Bila gitleaks di-upgrade, ganti URL +
      # SHA dari file checksums rilis yang bersangkutan.

  # Envelope guard v3.1 (Bab 4.6, docs/autonomy.md). Classifies every change
  # with scripts/autonomy_gate.py taken from MAIN and checked against the
  # pinned SHA-256. On main it FAILS (main red -> next cycle HALTs) when a
  # HARD change landed without Fahmi, or a VETO change skipped the veto
  # window. On PRs and rsi/ branches it only reports the class.
  envelope-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      OWNER: fahmi0812
      GATE_SHA256: e5cc5cd1730527ae3e4520f6d4e8a6d9bdc0299e7d66d64fc6057f47a5556e8e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Classify the change and check who let it in
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          GHREF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --quiet origin main
          git show origin/main:scripts/autonomy_gate.py > /tmp/gate.py
          echo "$GATE_SHA256  /tmp/gate.py" | sha256sum -c - || { echo "autonomy_gate.py on main is not the pinned version - Fahmi must re-pin GATE_SHA256"; exit 1; }
          python3 - <<'PY'
          import json, os, subprocess, sys
          ev, ref, actor, owner, repo = (os.environ[k] for k in ('EVENT', 'GHREF', 'ACTOR', 'OWNER', 'REPO'))
          def git(*a):
              return subprocess.run(['git', *a], capture_output=True, text=True).stdout.strip()
          head = git('rev-parse', 'HEAD')
          if ev == 'pull_request':
              base = git('merge-base', f"origin/{os.environ.get('BASE_REF') or 'main'}", head)
          elif ev == 'push' and ref == 'refs/heads/main' and set(os.environ.get('BEFORE', '0')) - {'0'}:
              base = os.environ['BEFORE']
          elif ref == 'refs/heads/main':
              base = git('rev-parse', 'HEAD~1')
          else:
              base = git('merge-base', 'origin/main', head)
          r = subprocess.run([sys.executable, '/tmp/gate.py', 'classify', '--json', '--repo', '.',
                              '--base', base, '--head', head], capture_output=True, text=True)
          try:
              v = json.loads(r.stdout[r.stdout.index('{'):])
          except ValueError:
              v = {'class': 'HARD', 'reasons': ['gate output unreadable: ' + r.stdout[-200:] + r.stderr[-200:]]}
          print(f"class={v['class']} ({ev} {ref}, {base[:8]}..{head[:8]})")
          for reason in v.get('reasons', [])[:20]:
              print('  ' + reason)
          if ref != 'refs/heads/main' or ev == 'pull_request' or v['class'] == 'AUTO':
              print('envelope-guard: report only'); sys.exit(0)
          if actor == owner:
              print(f'{v["class"]} change pushed by {owner} himself -> OK'); sys.exit(0)
          shas = git('rev-list', f'{base}..{head}').split()
          ok = True
          for sha in shas:
              out = subprocess.run(['gh', 'api', f'repos/{repo}/commits/{sha}/pulls'], capture_output=True, text=True).stdout
              prs = json.loads(out) if out.strip() else []
              merged_by = set()
              for pr in prs:
                  full = json.loads(subprocess.run(['gh', 'api', f"repos/{repo}/pulls/{pr['number']}"],
                                                   capture_output=True, text=True).stdout or '{}')
                  if full.get('merged_by'):
                      merged_by.add(full['merged_by']['login'])
              allowed = {owner} | ({'github-actions[bot]'} if v['class'] == 'VETO' else set())
              if not merged_by & allowed:
                  ok = False
                  print(f'{sha[:8]}: {v["class"]} change landed on main without '
                        + ('Fahmi' if v['class'] == 'HARD' else 'the veto window') + f' (merged_by={sorted(merged_by) or "direct push"})')
          if not ok:
              print('ENVELOPE VIOLATION: main is red until Fahmi reviews or reverts. The next cycle HALTs.')
              sys.exit(1)
          print('envelope-guard: every protected change on main came through Fahmi or the veto window')
          PY

  # Held-out eval slot (G2, Bab 4.6): kasus parafrase tersembunyi.
  # AKTIFKAN hanya setelah Fahmi memasang secret HELDOUT_EVAL_B64
  # (kasus terenkripsi, dibuat sesi asisten terpisah) — job ini HANYA
  # mencetak skor agregat, tidak pernah mencetak isi kasus.
  held-out:
    runs-on: ubuntu-latest
    if: ${{ false }}  # ubah ke true setelah secret HELDOUT_EVAL_B64 dipasang
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Held-out eval (aggregate score only)
        env:
          HELDOUT_EVAL_B64: ${{ secrets.HELDOUT_EVAL_B64 }}
        run: |
          echo "TODO: decrypt HELDOUT_EVAL_B64, run eval, print ONLY the aggregate score."
          echo "Never print case contents — this repo is public."
